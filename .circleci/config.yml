# CircleCI SETUP config for the merged cassandra-ecosystem repo.
#
# CircleCI has no native path filtering, so we use dynamic config: this setup
# workflow diffs the change against trunk with the path-filtering orb, sets the
# `run-analytics` / `run-sidecar` pipeline parameters, then hands off to
# continue-config.yml (via the continuation orb, which path-filtering wraps).
# continue-config.yml gates each project's workflow on those parameters.
#
# REQUIRES: "Enable dynamic config using setup workflows" must be turned on for this
# project in CircleCI (Project Settings > Advanced). On an ASF repo that toggle is
# INFRA-owned — file an INFRA ticket when provisioning. Until then this file is inert.
#
# Mapping notes:
#   - analytics/**            -> run-analytics
#   - sidecar/**              -> run-sidecar
#   - shared root files       -> BOTH (safe default: a change to root build/CI
#                                orchestration should exercise both projects)

version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@1.3.0

workflows:
  setup:
    jobs:
      - path-filtering/filter:
          name: detect-changes
          base-revision: trunk
          config-path: .circleci/continue-config.yml
          # <regex> <pipeline-parameter> <value>
          mapping: |
            analytics/.*         run-analytics true
            sidecar/.*           run-sidecar   true
            \.circleci/.*        run-analytics true
            \.circleci/.*        run-sidecar   true
            \.asf\.yaml          run-analytics true
            \.asf\.yaml          run-sidecar   true
            Makefile             run-analytics true
            Makefile             run-sidecar   true
